```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Выборы Farabi School</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a5cff, #a855f7);
        }

        .card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .emoji {
            font-size: 55px;
        }

        h1 {
            color: #333;
            margin: 10px 0;
            font-size: 30px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6a5cff;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #6a5cff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            background: #5748e8;
        }

        #success {
            display: none;
        }

        .candy {
            font-size: 60px;
            margin: 15px;
        }

        .success-title {
            color: #6a5cff;
        }
    </style>
</head>

<body>

<div class="card" id="formCard">

    <div class="emoji">🗳️</div>

    <h1>Выбери Мадину 10б и получи конфету</h1>

    <p>
        Заполните данные за лучшего призедента
    </p>

    <form id="voteForm">

        <input
            type="text"
            id="name"
            placeholder="Ваше имя"
            required
        >

        <input
            type="text"
            id="class"
            placeholder="Ваш класс"
            required
        >

        <select id="candidate" required>
            <option value="">Выберите кандидата</option>
            <option value="Мадина">Мадина</option>
            
        </select>

        <button type="submit">
            Отправить голос 🗳️
        </button>

    </form>

</div>


<div class="card" id="success">

    <div class="candy">🍫</div>

    <h1 class="success-title">
        Спасибо за участие!
    </h1>

    <p>
        Ваш голос принят.
    </p>

    <p>
        Если вам положена конфета в рамках акции,
        обратитесь к Мадине.
    </p>

    <button onclick="location.reload()">
        Готово
    </button>

</div>


<script>
    document.getElementById("voteForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const studentClass = document.getElementById("class").value;
        const candidate = document.getElementById("candidate").value;

        console.log("Имя:", name);
        console.log("Класс:", studentClass);
        console.log("Кандидат:", candidate);

        document.getElementById("formCard").style.display = "none";
        document.getElementById("success").style.display = "block";

    });
</script>

</body>
</html>
```
